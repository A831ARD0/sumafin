<title>Sumafin</title>
<style>
:root{
  --navy:#133E80;--navy-deep:#0A2B5C;--blue:#1E70B8;--cyan:#5BB3D9;
  --cyan-light:#A8DBED;--tint:#E8F4FA;--tint-soft:#F4FAFC;
  --bg:#FFFFFF;--bg-soft:#F7FAFC;--bg-tint:var(--tint);--surface:#FFFFFF;
  --ink:#0A1A2F;--ink-2:#3D4A5F;--ink-3:#7E8AA0;--ink-4:#B0BACB;
  --line:#E4EAF0;--line-2:#D4DDE7;
  --primary:var(--navy);--primary-ink:#FFFFFF;--primary-soft:var(--blue);
  --accent:var(--cyan);--accent-2:var(--cyan-light);
  --radius-xs:6px;--radius-sm:10px;--radius:16px;--radius-lg:24px;--radius-xl:32px;
  --shadow-xs:0 1px 2px rgba(10,26,47,.04);
  --shadow-sm:0 2px 8px -2px rgba(10,26,47,.06),0 1px 0 rgba(10,26,47,.02);
  --shadow:0 12px 32px -16px rgba(10,26,47,.12),0 2px 6px -2px rgba(10,26,47,.06);
  --shadow-lg:0 32px 80px -32px rgba(10,26,47,.22),0 8px 24px -8px rgba(10,26,47,.10);
  --shadow-blue:0 16px 48px -16px rgba(30,112,184,.32);
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;
  line-height:1.55;font-feature-settings:"ss01","cv11";
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
img{display:block;max-width:100%}
input,textarea,select{font-family:inherit}
.container{width:min(1280px,calc(100% - 48px));margin:0 auto}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12.5px;font-weight:500;
  color:var(--blue);letter-spacing:-0.005em}
.eyebrow .dot-grid{display:inline-grid;grid-template-columns:4px 4px;gap:2px}
.eyebrow .dot-grid span{width:4px;height:4px;border-radius:1px}
.eyebrow .dot-grid span:nth-child(1){background:var(--cyan-light)}
.eyebrow .dot-grid span:nth-child(2){background:var(--cyan)}
.eyebrow .dot-grid span:nth-child(3){background:var(--blue)}
.eyebrow .dot-grid span:nth-child(4){background:var(--navy)}
.h-display{font-size:clamp(48px,6.4vw,96px);font-weight:600;line-height:.98;
  letter-spacing:-.035em;margin:0;text-wrap:balance}
.h-section{font-size:clamp(36px,4.4vw,60px);font-weight:600;line-height:1.02;
  letter-spacing:-.03em;margin:16px 0 0;text-wrap:balance}
.lede{font-size:19px;color:var(--ink-2);line-height:1.5;max-width:560px;text-wrap:pretty;font-weight:400}
.section-sub{font-size:17px;color:var(--ink-2);max-width:580px;margin-top:16px;text-wrap:pretty}
.mono{font-family:var(--mono)}
.txt-blue{color:var(--blue)}.txt-navy{color:var(--navy)}.txt-cyan{color:var(--cyan)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 20px;border-radius:999px;border:1px solid transparent;
  font-family:inherit;font-weight:500;font-size:14.5px;letter-spacing:-.005em;
  transition:transform .15s ease,background .2s ease,color .2s ease,border-color .2s ease,box-shadow .2s ease;
  white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:var(--primary-ink);
  box-shadow:0 1px 0 rgba(255,255,255,.18) inset,var(--shadow-sm)}
.btn-primary:hover{background:var(--navy-deep);box-shadow:var(--shadow-blue)}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.18) inset,var(--shadow-sm)}
.btn-blue:hover{background:var(--navy)}
.btn-ghost{background:var(--bg);color:var(--ink);border-color:var(--line-2)}
.btn-ghost:hover{border-color:var(--ink);background:var(--bg-soft)}
.btn-tint{background:var(--tint);color:var(--navy);border-color:transparent}
.btn-tint:hover{background:var(--cyan-light)}
.btn-link{background:transparent;padding:6px 0;color:var(--blue);border-radius:0;position:relative}
.btn-link::after{content:"";position:absolute;left:0;right:16px;bottom:2px;height:1px;
  background:currentColor;opacity:.35;transition:right .2s ease,opacity .2s ease}
.btn-link:hover::after{right:0;opacity:1}
.btn-sm{padding:8px 14px;font-size:13px}
.btn-lg{padding:16px 26px;font-size:16px;gap:10px}
.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.78);
  backdrop-filter:saturate(160%) blur(14px);-webkit-backdrop-filter:saturate(160%) blur(14px);
  border-bottom:1px solid transparent;transition:border-color .2s ease,background .2s ease}
.nav.scrolled{border-bottom-color:var(--line);background:rgba(255,255,255,.92)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;padding:16px 0;gap:32px}
.brand{display:inline-flex;align-items:center;gap:10px}
.brand-mark-svg{width:32px;height:32px;flex-shrink:0}
.brand-wordmark{font-weight:700;font-size:22px;letter-spacing:-.04em;color:var(--navy);line-height:1}
.brand-wordmark .sub{display:block;font-size:9.5px;font-weight:500;color:var(--blue);
  letter-spacing:.04em;margin-top:3px;opacity:.8}
.nav-links{display:flex;gap:26px}
.nav-links a{font-size:14px;font-weight:500;color:var(--ink-2);padding:6px 0;
  position:relative;transition:color .15s ease}
.nav-links a:hover{color:var(--navy)}
.nav-links a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
  background:var(--blue);transform:scaleX(0);transform-origin:left;transition:transform .2s ease}
.nav-links a:hover::after{transform:scaleX(1)}
.nav-cta{display:flex;align-items:center;gap:10px}
.hero{padding:64px 0 96px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;top:-200px;right:-200px;width:600px;height:600px;
  border-radius:50%;background:radial-gradient(circle,var(--tint) 0%,transparent 70%);
  pointer-events:none;z-index:0}
.hero-inner{position:relative;z-index:1}
.hero-grid{display:grid;grid-template-columns:1.08fr 1fr;gap:80px;align-items:center}
.hero-tag{display:inline-flex;align-items:center;gap:10px;padding:6px 14px 6px 8px;
  border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:13px;
  font-weight:500;color:var(--ink-2);box-shadow:var(--shadow-xs)}
.hero-tag .pulse{width:8px;height:8px;border-radius:50%;background:#22C55E;
  box-shadow:0 0 0 4px rgba(34,197,94,.18)}
.hero h1{margin:24px 0 24px}
.hero-ctas{display:flex;gap:12px;margin-top:36px;flex-wrap:wrap}
.hero-trust{margin-top:56px;display:flex;gap:28px;align-items:center;flex-wrap:wrap;
  font-size:13px;color:var(--ink-3)}
.hero-trust-item{display:inline-flex;align-items:center;gap:8px}
.hero-trust-item .ico-mini{width:22px;height:22px;border-radius:50%;background:var(--tint);
  color:var(--blue);display:inline-flex;align-items:center;justify-content:center}
.hero-visual{position:relative;aspect-ratio:1/1;max-width:520px;margin-left:auto}
.hv-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px;width:100%;height:100%}
.hv-cell{border-radius:var(--radius-lg);padding:26px;display:flex;flex-direction:column;
  justify-content:space-between;position:relative;overflow:hidden;transition:transform .3s ease}
.hv-cell:hover{transform:translateY(-4px)}
.hv-cell .hv-label{font-size:11.5px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;opacity:.65}
.hv-cell .hv-value{font-size:clamp(36px,4vw,56px);font-weight:600;line-height:1;letter-spacing:-.035em}
.hv-cell .hv-caption{font-size:13.5px;line-height:1.35;max-width:200px}
.hv-1{background:var(--cyan-light);color:var(--navy)}
.hv-2{background:var(--cyan);color:var(--navy-deep)}
.hv-3{background:var(--blue);color:#fff}
.hv-4{background:var(--navy);color:#fff}
.hv-cell .hv-ico{position:absolute;right:16px;top:16px;opacity:.35}
.stats-strip{padding:64px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:48px}
.stat-block .stat-n{font-size:clamp(48px,5.4vw,72px);font-weight:600;line-height:1;
  letter-spacing:-.035em;color:var(--navy);font-feature-settings:"ss01"}
.stat-block .stat-n .unit{font-size:.4em;color:var(--blue);font-weight:500;letter-spacing:-.02em;margin-left:4px}
.stat-block .stat-l{font-size:14px;color:var(--ink-2);margin-top:10px;max-width:220px}
section{padding:112px 0;position:relative}
.section-head{display:grid;grid-template-columns:1.1fr 1fr;gap:64px;align-items:end;margin-bottom:64px}
.section-head .right{font-size:15.5px;color:var(--ink-2);max-width:460px;padding-bottom:12px}
.products{background:var(--bg-soft)}
.products-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.product-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);
  padding:44px;display:flex;flex-direction:column;position:relative;overflow:hidden;
  transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.product-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--line-2)}
.product-card.featured{background:linear-gradient(160deg,var(--navy) 0%,var(--navy-deep) 100%);
  color:#fff;border-color:var(--navy)}
.product-card.featured::before{content:"";position:absolute;top:-100px;right:-100px;width:300px;height:300px;
  border-radius:50%;background:radial-gradient(circle,rgba(91,179,217,.20) 0%,transparent 70%);pointer-events:none}
.product-tag{align-self:flex-start;font-size:12px;font-weight:500;padding:5px 12px;border-radius:999px;
  background:var(--tint);color:var(--blue);letter-spacing:-.005em}
.product-card.featured .product-tag{background:rgba(91,179,217,.20);color:var(--cyan-light)}
.product-icon{width:56px;height:56px;border-radius:var(--radius);background:var(--tint);color:var(--blue);
  display:inline-flex;align-items:center;justify-content:center;margin:22px 0 18px;position:relative}
.product-card.featured .product-icon{background:rgba(91,179,217,.16);color:var(--cyan-light)}
.product-card h3{font-size:38px;font-weight:600;line-height:1.05;letter-spacing:-.03em;margin:0 0 12px}
.product-meta{font-size:15.5px;color:var(--ink-2);margin-bottom:28px;max-width:380px;line-height:1.5}
.product-card.featured .product-meta{color:rgba(255,255,255,.75)}
.product-features{display:flex;flex-direction:column;gap:0;margin-bottom:28px}
.product-feat-item{padding:14px 0;border-top:1px solid var(--line);display:flex;gap:12px;
  align-items:flex-start;font-size:14.5px;color:var(--ink)}
.product-feat-item:last-child{border-bottom:1px solid var(--line)}
.product-card.featured .product-feat-item{border-color:rgba(255,255,255,.12);color:rgba(255,255,255,.95)}
.product-feat-item .check{width:20px;height:20px;border-radius:50%;background:var(--blue);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.product-card.featured .product-feat-item .check{background:var(--cyan);color:var(--navy-deep)}
.product-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:32px;
  padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.product-card.featured .product-stats{border-color:rgba(255,255,255,.12)}
.product-stat .stat-num{font-size:28px;font-weight:600;line-height:1;letter-spacing:-.02em;color:var(--navy)}
.product-card.featured .product-stat .stat-num{color:var(--cyan)}
.product-stat .stat-lbl{font-size:12px;color:var(--ink-3);margin-top:6px}
.product-card.featured .product-stat .stat-lbl{color:rgba(255,255,255,.55)}
.product-cta-row{margin-top:auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.process{background:var(--bg)}
.process-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:0}
.process-step{background:var(--bg-soft);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:32px 28px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;
  transition:transform .25s ease,box-shadow .25s ease}
.process-step:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.process-step .step-n{font-family:var(--mono);font-size:11px;color:var(--blue);letter-spacing:.12em;font-weight:500}
.process-step .step-icon{width:48px;height:48px;border-radius:12px;background:var(--bg);color:var(--navy);
  display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);box-shadow:var(--shadow-xs)}
.process-step h4{font-size:22px;font-weight:600;line-height:1.15;letter-spacing:-.02em;margin:6px 0 4px}
.process-step p{font-size:14px;color:var(--ink-2);margin:0;line-height:1.5}
.benefits{background:var(--bg)}
.benefits-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.benefit{padding:32px;border-radius:var(--radius-lg);background:var(--bg-soft);border:1px solid var(--line);
  display:flex;flex-direction:column;gap:16px;transition:background .2s ease,border-color .2s ease}
.benefit:hover{background:var(--tint-soft);border-color:var(--cyan-light)}
.benefit-ico{width:48px;height:48px;border-radius:12px;background:var(--bg);color:var(--blue);
  display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.benefit h4{font-size:20px;font-weight:600;line-height:1.2;letter-spacing:-.02em;margin:4px 0 0}
.benefit p{font-size:14.5px;color:var(--ink-2);margin:0;line-height:1.5}
.requisitos{background:var(--bg-soft)}
.req-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.req-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:36px}
.req-card .req-meta{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--blue);
  font-weight:500;padding:5px 10px;border-radius:999px;background:var(--tint);margin-bottom:18px}
.req-card h3{font-size:28px;font-weight:600;margin:0 0 6px;letter-spacing:-.025em}
.req-card .req-sub{font-size:14.5px;color:var(--ink-2);margin-bottom:22px}
.req-list{list-style:none;padding:0;margin:0}
.req-list li{display:flex;gap:12px;align-items:flex-start;padding:14px 0;
  border-top:1px solid var(--line);font-size:14.5px;color:var(--ink)}
.req-list li::before{content:"";width:6px;height:6px;margin-top:8px;border-radius:1px;
  background:var(--blue);flex-shrink:0;box-shadow:0 0 0 4px var(--tint)}
.cotiza{background:var(--bg);padding:112px 0}
.cotiza-inner{background:linear-gradient(160deg,var(--navy) 0%,var(--navy-deep) 60%,var(--blue) 100%);
  border-radius:var(--radius-xl);padding:64px 56px;position:relative;overflow:hidden}
.cotiza-inner::before{content:"";position:absolute;top:-100px;right:-100px;width:400px;height:400px;
  border-radius:50%;background:radial-gradient(circle,rgba(91,179,217,.25) 0%,transparent 70%);pointer-events:none}
.cotiza-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:center;position:relative;z-index:1}
.cotiza h2{font-size:clamp(36px,4.4vw,56px);font-weight:600;line-height:1.02;letter-spacing:-.03em;
  color:#fff;margin:18px 0 18px;text-wrap:balance}
.cotiza .lede{color:rgba(255,255,255,.78);max-width:460px}
.cotiza .channels{margin-top:36px;display:flex;flex-direction:column;gap:12px}
.cotiza-channel{display:flex;align-items:center;gap:16px;padding:16px 18px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:var(--radius);
  transition:background .2s ease,border-color .2s ease;color:#fff;max-width:380px}
.cotiza-channel:hover{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.2)}
.cotiza-channel .ch-ico{width:40px;height:40px;border-radius:10px;background:rgba(91,179,217,.20);
  color:var(--cyan-light);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.cotiza-channel .ch-label{font-size:12px;color:rgba(255,255,255,.55)}
.cotiza-channel .ch-value{font-size:16px;font-weight:500;margin-top:2px}
.cotiza-channel .ch-arrow{margin-left:auto;opacity:.55}
.cotiza-card{background:rgba(255,255,255,.06);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.14);border-radius:var(--radius-lg);padding:36px;color:#fff}
.cotiza-card h3{font-size:24px;font-weight:600;margin:0 0 4px;letter-spacing:-.02em}
.cotiza-card .ccc-sub{font-size:14px;color:rgba(255,255,255,.65);margin-bottom:24px}
.cotiza-card label{display:block;font-size:12px;color:rgba(255,255,255,.65);margin-bottom:6px;font-weight:500}
.cotiza-card .field{margin-bottom:14px}
.cotiza-card input,.cotiza-card select{width:100%;padding:13px 14px;border-radius:10px;
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:#fff;
  font-size:14.5px;transition:border-color .2s ease,background .2s ease}
.cotiza-card input::placeholder{color:rgba(255,255,255,.4)}
.cotiza-card input:focus,.cotiza-card select:focus{outline:none;border-color:var(--cyan);background:rgba(255,255,255,.08)}
.cotiza-card select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a8dbed' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center;background-size:18px;padding-right:40px}
.cotiza-card option{background:var(--navy-deep);color:#fff}
.cotiza-card .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cotiza-card .btn{width:100%;padding:14px;margin-top:6px}
.cotiza-card .privacy{font-size:11.5px;color:rgba(255,255,255,.5);margin-top:14px;text-align:center}
.cotiza-card.sent{text-align:center;padding:56px 36px}
.cotiza-card.sent .success-ico{width:64px;height:64px;border-radius:50%;background:var(--cyan);
  color:var(--navy-deep);display:inline-flex;align-items:center;justify-content:center;margin:0 auto 20px}
.testimonials{background:var(--bg-soft)}
.testi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.testi-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:32px;display:flex;flex-direction:column;gap:24px}
.testi-stars{display:inline-flex;gap:2px;color:var(--blue)}
.testi-quote{font-size:17px;line-height:1.45;letter-spacing:-.01em;color:var(--ink);margin:0;font-weight:400}
.testi-author{display:flex;align-items:center;gap:12px;margin-top:auto}
.testi-avatar{width:44px;height:44px;border-radius:50%;
  background:linear-gradient(135deg,var(--navy),var(--blue));
  display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:17px}
.testi-name{font-size:14.5px;font-weight:600}
.testi-role{font-size:12.5px;color:var(--ink-3)}
.sucursales{background:var(--bg)}
.suc-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.suc-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);
  overflow:hidden;display:flex;flex-direction:column;transition:transform .25s ease,box-shadow .25s ease}
.suc-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.suc-map{height:220px;position:relative;overflow:hidden;background:var(--tint)}
.suc-body{padding:32px}
.suc-state{font-size:12px;font-weight:500;color:var(--blue);letter-spacing:-.005em}
.suc-card h3{font-size:32px;font-weight:600;margin:4px 0 18px;letter-spacing:-.025em}
.suc-info{display:flex;flex-direction:column;gap:12px}
.suc-info .row{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--ink-2)}
.suc-info .row .ico-wrap{width:28px;height:28px;border-radius:8px;background:var(--tint);color:var(--blue);
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.suc-info .row strong{display:block;color:var(--ink);font-weight:500}
.suc-actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.faq{background:var(--bg-soft)}
.faq-grid{display:grid;grid-template-columns:1fr 1.4fr;gap:80px;align-items:start}
.faq-list{display:flex;flex-direction:column;gap:12px}
.faq-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  transition:border-color .2s ease,box-shadow .2s ease}

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  React.useEffect(() => {
    const ALLOWED = [window.location.origin, 'https://claude.ai', 'https://claudeusercontent.com'];
    const onMsg = (e) => {
      if (!ALLOWED.some((o) => e.origin === o || e.origin.endsWith('.claudeusercontent.com'))) return;
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);
  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div className="twk-panel" style={{ right: 16, bottom: 16 }}>
        <div className="twk-hd"><b>{title}</b>
          <button className="twk-x" onClick={() => setOpen(false)}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function Cotizacion() {
  const [sent, setSent] = useState(false);
  const [sending, setSending] = useState(false);
  const [sendError, setSendError] = useState('');
  const [fields, setFields] = useState({ nombre: '', tel: '', email: '', producto: '', ciudad: '' });
  const [touched, setTouched] = useState({});
  const [honeypot, setHoneypot] = useState('');
  const RATE_LIMIT_MS = 3 * 60 * 1000;
  const [rateLimitMsg, setRateLimitMsg] = useState(() => {
    try {
      const last = sessionStorage.getItem('sf_last_submit');
      if (!last) return '';
      const diff = Date.now() - parseInt(last, 10);
      if (diff < RATE_LIMIT_MS) { const mins = Math.ceil((RATE_LIMIT_MS - diff) / 60000); return `Solicitud recibida. Espera ${mins} min antes de enviar otra.`; }
    } catch {}
    return '';
  });
  const validators = {
    nombre: (v) => v.trim().length >= 3 ? '' : 'Escribe tu nombre completo',
    tel: (v) => /^\d[\d\s\-]{8,}$/.test(v.trim()) ? '' : 'Teléfono inválido (mín. 10 dígitos)',
    email: (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()) ? '' : 'Correo inválido',
    producto: (v) => v ? '' : 'Selecciona un producto',
    ciudad: (v) => v ? '' : 'Selecciona tu ciudad',
  };
  const errors = Object.fromEntries(Object.entries(fields).map(([k, v]) => [k, validators[k](v)]));
  const isValid = Object.values(errors).every((e) => e === '');
  const set = (k) => (e) => setFields((f) => ({ ...f, [k]: e.target.value }));
  const blur = (k) => () => setTouched((t) => ({ ...t, [k]: true }));
  const onSubmit = async (e) => {
    e.preventDefault();
    if (honeypot) return;
    try {
      const last = sessionStorage.getItem('sf_last_submit');
      if (last && Date.now() - parseInt(last, 10) < RATE_LIMIT_MS) {
        const mins = Math.ceil((RATE_LIMIT_MS - (Date.now() - parseInt(last, 10))) / 60000);
        setRateLimitMsg(`Ya enviaste una solicitud. Espera ${mins} min antes de enviar otra.`); return;
      }
    } catch {}
    setTouched({ nombre: true, tel: true, email: true, producto: true, ciudad: true });
    if (!isValid) return;
    setSending(true); setSendError('');
    try {
      const res = await fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ access_key: WEB3FORMS_KEY, subject: `Nueva cotización Sumafin — ${fields.producto} · ${fields.ciudad}`, from_name: 'Sumafin Web', botcheck: false, nombre: fields.nombre, telefono: fields.tel, correo: fields.email, producto: fields.producto, ciudad: fields.ciudad }),
      });
      const data = await res.json();
      if (data.success) { try { sessionStorage.setItem('sf_last_submit', String(Date.now())); } catch {} setSent(true); }
      else { setSendError('No se pudo enviar. Intenta de nuevo o llámanos directamente.'); }
    } catch { setSendError('Error de conexión. Verifica tu internet e intenta de nuevo.'); }
    finally { setSending(false); }
  };
  const fieldErr = (k) => touched[k] && errors[k] ? <span style={{fontSize:11,color:'#fca5a5',marginTop:4,display:'block'}}>{errors[k]}</span> : null;

  return (
    <section className="cotiza" id="cotiza">
      <div className="container">
        <div className="cotiza-inner">
          <div className="cotiza-grid">
            <div>
              <span className="eyebrow" style={{color:'var(--cyan-light)'}}>
                <span className="dot-grid"><span /><span /><span /><span /></span>Solicita tu cotización
              </span>
              <h2>Déjanos tus datos y un asesor te contacta <span style={{color:'var(--cyan)'}}>hoy mismo.</span></h2>
              <p className="lede">Sin compromiso. Sólo platicamos contigo para entender qué buscas y armarte la mejor opción.</p>
            </div>
            {sent ? (
              <div className="cotiza-card sent">
                <div className="success-ico"><Icon name="check" size={32} stroke={3} /></div>
                <h3>¡Recibimos tu solicitud!</h3>
                <p style={{color:'rgba(255,255,255,.7)',margin:'8px 0 0'}}>Un asesor de Sumafin te contactará en las próximas <strong style={{color:'#fff'}}>2 horas hábiles</strong> al teléfono o correo que indicaste.</p>
                <button className="btn btn-ghost" style={{marginTop:24,color:'#fff',borderColor:'rgba(255,255,255,.25)'}}
                  onClick={() => { setSent(false); setFields({ nombre:'',tel:'',email:'',producto:'',ciudad:'' }); setTouched({}); }}>
                  Enviar otra solicitud
                </button>
              </div>
            ) : (
              <form className="cotiza-card" onSubmit={onSubmit} noValidate>
                <div aria-hidden="true" style={{position:'absolute',left:'-9999px',width:0,height:0,overflow:'hidden',opacity:0}}>
                  <label>Do not fill this field</label>
                  <input type="text" name="website_url" tabIndex={-1} autoComplete="off" value={honeypot} onChange={(e) => setHoneypot(e.target.value)} />
                </div>
                <h3>Solicita una cotización</h3>
                <div className="ccc-sub">Responde 5 datos y un asesor te llama hoy.</div>
                <div className="form-row">
                  <div className="field">
                    <label>Nombre completo</label>
                    <input type="text" placeholder="Tu nombre" value={fields.nombre} onChange={set('nombre')} onBlur={blur('nombre')} style={touched.nombre && errors.nombre ? {borderColor:'#fca5a5'} : {}} />
                    {fieldErr('nombre')}
                  </div>
                  <div className="field">
                    <label>Teléfono</label>
                    <input type="tel" placeholder="951 000 0000" value={fields.tel} onChange={set('tel')} onBlur={blur('tel')} style={touched.tel && errors.tel ? {borderColor:'#fca5a5'} : {}} />
                    {fieldErr('tel')}
                  </div>
                </div>
                <div className="field">
                  <label>Correo electrónico</label>
                  <input type="email" placeholder="tu@correo.com" value={fields.email} onChange={set('email')} onBlur={blur('email')} style={touched.email && errors.email ? {borderColor:'#fca5a5'} : {}} />
                  {fieldErr('email')}
                </div>
                <div className="form-row">
                  <div className="field">
                    <label>Producto</label>
                    <select value={fields.producto} onChange={set('producto')} onBlur={blur('producto')} style={touched.producto && errors.producto ? {borderColor:'#fca5a5'} : {}}>
                      <option value="">Selecciona…</option>
                      <option value="Crédito automotriz">Crédito automotriz</option>
                      <option value="Arrendamiento">Arrendamiento</option>
                      <option value="Flotilla empresarial">Flotilla empresarial</option>
                      <option value="No estoy seguro/a">No estoy seguro/a</option>
                    </select>
                    {fieldErr('producto')}
                  </div>
                  <div className="field">
                    <label>Ciudad</label>
                    <select value={fields.ciudad} onChange={set('ciudad')} onBlur={blur('ciudad')} style={touched.ciudad && errors.ciudad ? {borderColor:'#fca5a5'} : {}}>
                      <option value="">Selecciona…</option>
                      <option value="Oaxaca de Juárez">Oaxaca de Juárez</option>
                      <option value="Puebla">Puebla</option>
                    </select>
                    {fieldErr('ciudad')}
                  </div>
                </div>
                <button type="submit" disabled={sending || !!rateLimitMsg} className="btn" style={{
                  background: isValid && !sending && !rateLimitMsg ? 'var(--cyan)' : 'rgba(91,179,217,.4)',
                  color:'var(--navy-deep)',fontWeight:600,
                  cursor: isValid && !sending && !rateLimitMsg ? 'pointer' : 'not-allowed',
                  transition:'background .2s ease',
                }}>
                  {sending ? 'Enviando…' : <> Solicitar cotización <Icon name="arrow-right" size={14} stroke={2.5} /></>}
                </button>
                {rateLimitMsg && <p style={{fontSize:12.5,color:'var(--cyan-light)',margin:'8px 0 0',textAlign:'center'}}>{rateLimitMsg}</p>}
                {sendError && <p style={{fontSize:12.5,color:'#fca5a5',margin:'8px 0 0',textAlign:'center'}}>{sendError}</p>}
                <div className="privacy">Al enviar aceptas nuestro aviso de privacidad.</div>
              </form>
            )}
          </div>
        </div>
      </div>
    </section>
  );
}

// ─── APP ───────────────────────────────────────────────────────────────────
const TWEAK_DEFAULTS = { showBrands: true, showStats: true, showTestimonials: true };

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  useEffect(() => {
    const onClick = (e) => {
      const a = e.target.closest('a[href^="#"]');
      if (!a) return;
      const id = a.getAttribute("href").slice(1);
      if (!id) return;
      const el = document.getElementById(id);
      if (el) { e.preventDefault(); const y = el.getBoundingClientRect().top + window.scrollY - 70; window.scrollTo({ top: y, behavior: "smooth" }); }
    };
    document.addEventListener("click", onClick);
    return () => document.removeEventListener("click", onClick);
  }, []);

  return (
    <>
      <AlertaBanner />
      <Nav />
      <Hero />
      {t.showStats && <StatsStrip />}
      <Products />
      <Process />
      <Benefits />
      <Requisitos />
      <Cotizacion />
      {t.showTestimonials && <Testimonials />}
      <Sucursales />
      <FAQ />
      {t.showBrands && <Brands />}
      <Footer />
      <TweaksPanel title="Sumafin · Tweaks">
        <TweakSection label="Secciones visibles" />
        <TweakToggle label="Stats strip" value={t.showStats} onChange={(v) => setTweak("showStats", v)} />
        <TweakToggle label="Testimonios" value={t.showTestimonials} onChange={(v) => setTweak("showTestimonials", v)} />
        <TweakToggle label="Marcas aliadas" value={t.showBrands} onChange={(v) => setTweak("showBrands", v)} />
      </TweaksPanel>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
